# Sample stack: glue2flow (g2f) + PostgreSQL + Keycloak (with a pre-configured demo realm).
#
#   docker compose up --build
#   open http://localhost:8080   (login: alice / alice, bob / bob, carol / carol)
#   alice is organization admin and plugin admin.
#   Keycloak admin console: http://localhost:8081  (admin / admin)
#
# NOT production-ready: default passwords, Keycloak in dev mode, plain HTTP.

name: g2f

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: g2f
      POSTGRES_PASSWORD: g2f
      POSTGRES_DB: g2f
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/10-keycloak.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U g2f -d g2f"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      # Tokens must carry the issuer the browser sees.
      KC_HOSTNAME: http://localhost:8081
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./deploy/keycloak/realm-g2f.json:/opt/keycloak/data/import/realm-g2f.json:ro
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy

  g2f:
    build: .
    image: g2f:latest
    environment:
      G2F_DATABASE_URL: postgres://g2f:g2f@postgres:5432/g2f?sslmode=disable
      G2F_PUBLIC_URL: http://localhost:8080
      G2F_AUTH_MODE: oidc
      # Expected token issuer (as seen by the browser) ...
      G2F_OIDC_ISSUER: http://localhost:8081/realms/g2f
      # ... while signing keys are fetched over the internal network.
      G2F_OIDC_JWKS_URL: http://keycloak:8080/realms/g2f/protocol/openid-connect/certs
      G2F_OIDC_CLIENT_ID: g2f
      G2F_OIDC_GROUPS_CLAIM: groups
      G2F_OIDC_ORG_CLAIM: org
      G2F_OIDC_ADMIN_ROLE: g2f-admin
      G2F_OIDC_PLUGIN_ADMIN_ROLE: g2f-plugin-admin
      # Encrypts node secrets and plugin settings. DEMO KEY - generate your own:
      #   openssl rand -base64 32
      # Rotate by moving the old key to G2F_SECRET_KEYS_OLD (comma separated).
      G2F_SECRET_KEY: ${G2F_SECRET_KEY:-ZzhnLWRlbW8ta2V5LU5PVC1mb3ItcHJvZHVjdGlvbiE=}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata:

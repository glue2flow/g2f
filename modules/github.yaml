# Declarative module: every node maps its parameters to one HTTP request.
# Parameters are available as `params`, the incoming item as `json`.
module: github
version: 1.0.0
name: GitHub
description: GitHub REST API
color: "#24292f"
icon: icons/github.svg # GitHub mark, from github.com/primer/octicons
# The API URL comes from the node's credential (default api.github.com); it
# can only name one of credentials.apiHosts.
baseUrl: "{{ credential.apiUrl }}"

# Personal access tokens are stored once as a credential (Connections page)
# and picked in nodes. Without a credential, nodes read public data.
credentials:
  optional: true
  fields:
    - name: token
      label: Personal access token
      type: secret
      required: true
      description: Fine-grained or classic token with access to the repositories the workflows use.
    - name: apiUrl
      label: API URL
      type: url
      default: https://api.github.com
      description: "GitHub Enterprise Cloud with data residency: https://api.<subdomain>.ghe.com"
  apiHosts: [api.github.com, "*.ghe.com"]

headers:
  Accept: application/vnd.github+json
  X-GitHub-Api-Version: "2022-11-28"
  Authorization: "{{ (credential.token ?? '') != '' ? 'Bearer ' + credential.token : '' }}"

nodes:
  - type: repo.get
    name: Get Repository
    description: Fetch metadata for a repository.
    params:
      - { name: owner, label: Owner, required: true, placeholder: octocat }
      - { name: repo, label: Repository, required: true, placeholder: hello-world }
    request:
      method: GET
      path: /repos/{{ params.owner }}/{{ params.repo }}
    outputSchema:
      fields:
        - { path: id, type: number }
        - { path: name, type: string }
        - { path: full_name, type: string, description: owner/name }
        - { path: description, type: string }
        - { path: html_url, type: string, description: Link to the repository }
        - { path: private, type: boolean }
        - { path: default_branch, type: string }
        - { path: stargazers_count, type: number }
        - { path: forks_count, type: number }
        - { path: open_issues_count, type: number }
        - { path: language, type: string }
        - { path: owner.login, type: string }
        - { path: created_at, type: string }
        - { path: pushed_at, type: string }

  - type: issues.list
    name: List Issues
    description: List open issues of a repository (one item per issue).
    params:
      - { name: owner, label: Owner, required: true }
      - { name: repo, label: Repository, required: true }
      - name: state
        label: State
        type: select
        default: open
        options:
          - { label: Open, value: open }
          - { label: Closed, value: closed }
          - { label: All, value: all }
    request:
      method: GET
      path: /repos/{{ params.owner }}/{{ params.repo }}/issues
      query:
        state: "{{ params.state }}"
        per_page: 50
    output: "{{ map(response.body, ({number: .number, title: .title, url: .html_url, user: .user.login})) }}"
    outputSchema:
      fields:
        - { path: number, type: number, description: Issue number }
        - { path: title, type: string }
        - { path: url, type: string, description: Link to the issue }
        - { path: user, type: string, description: Login of the author }

  - type: issues.create
    name: Create Issue
    description: Open a new issue.
    params:
      - { name: owner, label: Owner, required: true }
      - { name: repo, label: Repository, required: true }
      - { name: title, label: Title, required: true }
      - { name: body, label: Body, type: text }
    request:
      method: POST
      path: /repos/{{ params.owner }}/{{ params.repo }}/issues
      body:
        title: "{{ params.title }}"
        body: "{{ params.body }}"
    outputSchema:
      fields:
        - { path: id, type: number }
        - { path: number, type: number, description: Issue number }
        - { path: title, type: string }
        - { path: body, type: string }
        - { path: state, type: string }
        - { path: html_url, type: string, description: Link to the issue }
        - { path: user.login, type: string, description: Author }
        - { path: created_at, type: string }
